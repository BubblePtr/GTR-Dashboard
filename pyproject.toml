[project]
name = "gtrdashboard"
version = "0.1.0"
description = "GitHub Trending multi-agent content curation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.1.0",
    "sqlmodel>=0.0.24",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "rich>=14.0.0",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    "tavily-python>=0.5.0",
    "exa-py>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[project.scripts]
gtr = "gtrdashboard.cli:main"
gtr-api = "gtrdashboard.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtrdashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
